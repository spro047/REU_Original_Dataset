[project]
name = "suture-scoring"
version = "0.1.0"
description = "AI suturing quality scoring pipeline (REU project)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "openpyxl",
    "scipy",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
dev = ["pytest"]
notebook = ["pandas", "matplotlib", "nbconvert", "ipykernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]